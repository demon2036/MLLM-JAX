# MiniOneRec SID RL (v4-8) — short smoke run (steps=20) with upstream-aligned batch semantics.
# Use to quickly validate rollout/reward/logging/checkpointing before a full 2-epoch run.

base_model: Qwen/Qwen2.5-1.5B
output_dir: runs/minionerec_rl_jax_qwen25_1p5b_base_industrial_v4_8_steps20_pb256_ga2_mix_sync1_evalvalid_beam20_from_sft_rightpad_best_meshauto_20260201
seed: 42
device: tpu

resume_from_checkpoint: runs/sid_sft_jax_qwen25_1p5b_base_industrial_v4_8_e3_muon_rightpad_bestval_20260201/sft_state_best.msgpack

data:
  category: Industrial_and_Scientific
  train_file: workdir/MiniOneRec/data/Amazon/train/Industrial_and_Scientific_5_2016-10-2018-11.csv
  eval_file: workdir/MiniOneRec/data/Amazon/valid/Industrial_and_Scientific_5_2016-10-2018-11.csv
  test_file: workdir/MiniOneRec/data/Amazon/test/Industrial_and_Scientific_5_2016-10-2018-11.csv
  info_file: workdir/MiniOneRec/data/Amazon/info/Industrial_and_Scientific_5_2016-10-2018-11.txt
  sid_index_path: workdir/MiniOneRec/data/Amazon/index/Industrial_and_Scientific.index.json
  item_meta_path: workdir/MiniOneRec/data/Amazon/index/Industrial_and_Scientific.item.json
  enable_title2sid: true
  enable_seqtitle2sid: true
  sample_title2sid: -1
  sample_seqtitle2sid: 10000
  max_len: 512
  sample_train: -1
  sample_eval: -1
  sample_test: -1

jax:
  mesh_shape: "auto"
  param_dtype: bfloat16
  compute_dtype: bfloat16
  max_cache_length: 512

rollout:
  prompt_batch_size: 256
  prompt_micro_batch_size: 64
  num_generations: 16
  prompt_pad_len: 256
  global_length: 512

train:
  num_train_epochs: 2.0
  max_steps: 20
  gradient_accumulation_steps: 2
  grad_accum_steps: 64
  ppo_steps: 1

  beta: 0.001
  sync_ref_model: true
  sync_ref_model_every_steps: 1
  sync_ref_model_mixup_alpha: 1.0

  logging_steps: 1
  eval_steps: 0
  save_last: true
  save_best: true
  save_best_metric: ndcg@10

  optimizer:
    name: adamw
    clip_norm: 0.3
    weight_decay: 0.0
    lr_schedule:
      type: warmup_cosine
      init_value: 0.0
      peak_value: 1e-5
      end_value: 0.0
      warmup_ratio: 0.03
      warmup_steps: null

eval:
  enabled: true
  split: eval
  use_best_checkpoint: true
  every_steps: 0
  batch_size: 4
  num_beams: 20
  topk: [1, 3, 5, 10, 20]
  save_predictions_json: true

wandb:
  project: minionerec-sid-rl
  mode: online
  name: null

