project:
  wandb_project: openonerec-recif-bench
  wandb_mode: online
  run_name: onerec-1p7b-recif-reco-sglang-jax-engine-official-align-smoke

model:
  repo_id: OpenOneRec/OneRec-1.7B
  torch_dtype: bfloat16
  trust_remote_code: true

upstream:
  repo_url: https://github.com/Kuaishou-OneRec/OpenOneRec.git
  checkout_dir: workdirs/OpenOneRec

data:
  hf_dataset: OpenOneRec/OpenOneRec-RecIF
  local_dir: workdirs/raw_data/onerec_data
  include:
    - benchmark_data/**

llm:
  gemini_project: civil-rarity-482610-s5
  gemini_location: us-central1

generator:
  backend: sglang_jax_engine
  prefer_tpu: true
  batch_size: 8
  max_batch_size: 16
  beam_batch_size: 4
  engine:
    device: tpu
    tp_size: 4
    dp_size: 1
    trust_remote_code: true
    dtype: bfloat16
    log_level: error
    skip_server_warmup: true
    stream_output: false
    enable_single_process: true
    enable_tokenizer_batch_encode: true
    chunked_prefill_size: 4096
    max_prefill_tokens: 16384
    max_running_requests: 64
    precompile_bs_paddings: [8]
    precompile_token_paddings: [8192]
    page_size: 64
  beam_emulation:
    mode: top_logprobs_beam
    top_logprobs_num: 128
    candidate_multiplier: 1
    use_task_sampling_params: false
    temperature: 0.6
    top_p: 0.95
    top_k: 50
    deduplicate: true

eval:
  data_version: v1.0
  enable_thinking: false
  overwrite: true
  sample_size: 64
  disable_llm_judge: true
  tasks: [ad]
